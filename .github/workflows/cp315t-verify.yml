# cp315t: build and test the free-threaded (cp315t) wheel on Windows + Linux.
#
# This workflow is independent of the upstream packaging pipeline. It builds
# a version-specific free-threaded wheel (cp315-cp315t) using the nanobind
# -ft variant (which declares Py_mod_gil = NOT_USED) and runs a concurrent
# smoke test under a true no-GIL runtime.
#
# Prerequisites:
#   * Python 3.15 free-threaded build (actions/setup-python "3.15t")
#   * DuckDB engine submodule checked out (actions/checkout submodules: true)
#   * MSVC (windows-2022) or GCC (ubuntu-24.04) — pre-installed on runners

name: cp315t

on:
  push:
    branches: [cp315t]
  pull_request:
    branches: [cp315t]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python 3.15t (free-threaded)
        uses: actions/setup-python@v5
        with:
          python-version: "3.15t"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest "scikit-build-core>=1.0" "nanobind>=3.0" numpy

      - name: Verify GIL is disabled
        run: |
          import sys
          print(f"Python {sys.version}")
          print(f"GIL enabled: {sys._is_gil_enabled()}")
          assert not sys._is_gil_enabled(), "GIL should be disabled in free-threaded build"
        shell: python

      - name: Build wheel
        run: python -m build --wheel --no-isolation --outdir dist

      - name: Verify wheel tag
        run: |
          import glob, os
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected 1 wheel, got {wheels}"
          name = os.path.basename(wheels[0])
          print(f"Wheel: {name}")
          assert "cp315-cp315t" in name, f"Expected cp315-cp315t in {name}"
          print("Wheel tag OK")
        shell: python

      - name: Install built wheel
        # shell: python — pip must not receive the literal "dist/*.whl" (PowerShell
        # does not expand globs); expand the path in Python so it works on both OSes.
        run: |
          import glob, subprocess, sys
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"expected 1 wheel, got {wheels}"
          subprocess.check_call([sys.executable, "-m", "pip", "install",
                                 "--no-deps", "--force-reinstall", wheels[0]])
        shell: python

      - name: Run smoke test
        run: python -m pytest tests/fast/test_cp315t_smoke.py -v
