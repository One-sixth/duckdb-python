# cp315t auto-publish: build free-threaded wheels from the latest upstream
# release tag and publish to a rolling GitHub Release (tag: cp315t).
#
# Triggered daily at 12:00 Beijing time (04:00 UTC). The build runs only
# when upstream duckdb/duckdb-python has a NEW release tag (vX.Y.Z) that we
# have not published yet. Also supports manual dispatch with an optional
# "force" flag to rebuild the latest tag even if already published.
#
# Architecture:
#   check-upstream (ubuntu, ~5s)
#     Query upstream release tags, pick the newest vX.Y.Z, compare with the
#     tag recorded in the last release body. If unchanged and not forced,
#     skip everything.
#   build (windows-2022 + ubuntu-24.04 matrix, ~30min)
#     Checkout upstream at the release tag (with engine submodule) + our
#     fork's cp315t branch (patch + test) to _our/. Apply the CMake patch,
#     build the cp315t wheel, verify tag, run smoke test, upload artifact.
#   publish (ubuntu)
#     Download both platform artifacts, delete old release (--cleanup-tag),
#     create new rolling release with upstream-tag in the body.

name: cp315t-auto-publish

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC = 12:00 Beijing
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if the latest tag is already published'
        type: boolean
        default: false

jobs:
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      upstream_tag: ${{ steps.decide.outputs.upstream_tag }}
    steps:
      - name: Check upstream for new release tag
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Newest release tag matching vX.Y.Z (skip pre-releases/drafts)
          upstream_tag=$(gh api repos/duckdb/duckdb-python/releases --paginate \
            | python3 -c "
          import sys, json, re
          rels = json.load(sys.stdin)
          tags = [r['tag_name'] for r in rels
                  if re.fullmatch(r'v\d+\.\d+\.\d+', r['tag_name'])
                  and not r.get('prerelease')]
          # Semver-ish sort, newest first
          tags.sort(key=lambda t: tuple(int(x) for x in t[1:].split('.')), reverse=True)
          print(tags[0] if tags else '')
          ")
          if [[ -z "$upstream_tag" ]]; then
            echo "No upstream release tag found, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Newest upstream tag: $upstream_tag"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

          # Last published tag (from release body)
          last_tag=""
          body=$(gh release view cp315t --json body -q .body 2>/dev/null || echo "")
          last_tag=$(echo "$body" | grep -oP 'upstream-tag:\s*\Kv[0-9.]+' | head -1 || echo "")

          force="${{ inputs.force }}"
          if [[ "$upstream_tag" == "$last_tag" && "$force" != "true" ]]; then
            echo "Tag $upstream_tag already published, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag: $last_tag -> $upstream_tag (force=$force)"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout upstream at release tag
        uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb-python
          ref: ${{ needs.check-upstream.outputs.upstream_tag }}
          fetch-depth: 0
          submodules: true

      - name: Checkout our fork (patch + test)
        uses: actions/checkout@v4
        with:
          repository: One-sixth/duckdb-python
          ref: cp315t
          path: _our

      - name: Apply cp315t CMake patch
        run: git apply _our/patches/cp315t-cmake.patch

      - name: Set up Python 3.15t (free-threaded)
        uses: actions/setup-python@v5
        with:
          python-version: "3.15t"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest "scikit-build-core>=1.0" "nanobind>=3.0" numpy

      - name: Verify GIL is disabled
        run: |
          import sys
          print(f"Python {sys.version}")
          assert not sys._is_gil_enabled(), "GIL should be disabled"
        shell: python

      - name: Build wheel
        run: python -m build --wheel --no-isolation --outdir dist

      - name: Verify wheel tag
        run: |
          import glob, os
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected 1 wheel, got {wheels}"
          name = os.path.basename(wheels[0])
          print(f"Wheel: {name}")
          assert "cp315-cp315t" in name, f"Expected cp315-cp315t in {name}"
        shell: python

      - name: Install + smoke test
        run: |
          import glob, subprocess, sys
          wheels = glob.glob("dist/*.whl")
          subprocess.check_call([sys.executable, "-m", "pip", "install",
                                 "--no-deps", "--force-reinstall", wheels[0]])
          subprocess.check_call([sys.executable, "-m", "pytest",
                                 "_our/tests/fast/test_cp315t_smoke.py", "-v"])
        shell: python

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl

  publish:
    needs: [check-upstream, build]
    if: needs.check-upstream.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/

      - name: Create rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream_tag="${{ needs.check-upstream.outputs.upstream_tag }}"
          wheels=$(find dist -name "*.whl" | sort | tr '\n' ' ')
          echo "Wheels: $wheels"

          # Delete old release + tag (rolling)
          gh release delete cp315t --cleanup-tag --yes 2>/dev/null || true

          # Write notes to a file (avoids heredoc breaking YAML block scalar)
          {
            echo "Auto-published cp315t (free-threaded) wheels."
            echo ""
            echo "- upstream-tag: ${upstream_tag}"
            echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- platforms: windows-2022, ubuntu-24.04"
            echo "- python: 3.15t (free-threaded, GIL disabled)"
            echo ""
            echo "Install: pip install <wheel-file>"
            echo ""
            echo "This release is rolling: each successful build replaces the previous one."
          } > release_notes.md

          gh release create cp315t \
            --title "duckdb cp315t - upstream ${upstream_tag}" \
            --notes-file release_notes.md \
            $wheels
