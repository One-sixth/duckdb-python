# cp315t auto-publish: build free-threaded wheels from the latest upstream
# release tag and publish to a rolling GitHub Release (tag: cp315t).
#
# Triggered daily at 12:00 Beijing time (04:00 UTC). The build runs only
# when upstream duckdb/duckdb-python has a NEW release tag (vX.Y.Z), or the
# newest tag was re-pointed to a different commit, and we have not published
# that (tag, commit) pair yet. Also supports manual dispatch with an
# optional "force" flag to rebuild the latest tag even if already published.
#
# Architecture:
#   check-upstream (ubuntu, ~5s)
#     Query upstream release tags, pick the newest vX.Y.Z and the commit its
#     tag object points at. Compare (tag, commit) with the pair recorded in
#     the last release body. If unchanged and not forced, skip everything.
#   build (windows-2022 + ubuntu-24.04 matrix, ~30min)
#     Checkout upstream at the release tag (with engine submodule) + our
#     fork's cp315t-build branch (patch + test) to _our/. Apply the CMake patch,
#     build the cp315t wheel with OVERRIDE_GIT_DESCRIBE=<tag> so the wheel
#     carries the clean release version (duckdb-2.0.0-cp315-cp315t), verify
#     tag, run smoke test, upload artifact.
#   publish (ubuntu)
#     Download both platform artifacts, delete old release (--cleanup-tag),
#     create new rolling release with upstream tag + commit in the body.

name: cp315t-auto-publish

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC = 12:00 Beijing
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if the latest tag is already published'
        type: boolean
        default: false

jobs:
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      upstream_tag: ${{ steps.decide.outputs.upstream_tag }}
      upstream_commit: ${{ steps.decide.outputs.upstream_commit }}
    steps:
      - name: Check upstream for new release tag
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Newest release tag matching vX.Y.Z (skip pre-releases/drafts)
          upstream_tag=$(gh api repos/duckdb/duckdb-python/releases --paginate \
            | python3 -c "
          import sys, json, re
          rels = json.load(sys.stdin)
          tags = [r['tag_name'] for r in rels
                  if re.fullmatch(r'v\d+\.\d+\.\d+', r['tag_name'])
                  and not r.get('prerelease')]
          # Semver-ish sort, newest first
          tags.sort(key=lambda t: tuple(int(x) for x in t[1:].split('.')), reverse=True)
          print(tags[0] if tags else '')
          ")
          if [[ -z "$upstream_tag" ]]; then
            echo "No upstream release tag found, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Newest upstream tag: $upstream_tag"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

          # Commit the tag resolves to (the commits API peels annotated
          # tags down to the commit; lightweight tags are commits already)
          upstream_commit=$(gh api "repos/duckdb/duckdb-python/commits/$upstream_tag" -q .sha)
          echo "Tag commit: $upstream_commit"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"

          # Last published (tag, commit) pair (from release body)
          body=$(gh release view cp315t --repo One-sixth/duckdb-python --json body -q .body 2>/dev/null || echo "")
          last_tag=$(echo "$body" | grep -oP 'upstream-tag:\s*\Kv[0-9.]+' | head -1)
          last_commit=$(echo "$body" | grep -oP 'upstream-commit:\s*\K[a-f0-9]{7,}' | head -1)

          force="${{ inputs.force }}"
          if [[ "$upstream_tag" == "$last_tag" && "$upstream_commit" == "$last_commit" && "$force" != "true" ]]; then
            echo "Tag $upstream_tag @ $upstream_commit already published, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag: $last_tag @ $last_commit -> $upstream_tag @ $upstream_commit (force=$force)"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout upstream at release tag
        uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb-python
          ref: ${{ needs.check-upstream.outputs.upstream_tag }}
          fetch-depth: 0
          submodules: true

      - name: Checkout our fork (patch + test)
        uses: actions/checkout@v4
        with:
          repository: One-sixth/duckdb-python
          ref: cp315t-build
          path: _our

      - name: Apply cp315t CMake patch
        run: git apply _our/patches/cp315t-cmake.patch

      - name: Set up Python 3.15t (free-threaded)
        uses: actions/setup-python@v5
        with:
          python-version: "3.15t"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest "scikit-build-core>=1.0" "nanobind>=3.0" numpy

      - name: Verify GIL is disabled
        run: |
          import sys
          print(f"Python {sys.version}")
          assert not sys._is_gil_enabled(), "GIL should be disabled"
        shell: python

      - name: Build wheel
        env:
          # Force the clean release version (e.g. 2.0.0) instead of the
          # default <declared>.dev<timestamp> that git-checkout builds get.
          OVERRIDE_GIT_DESCRIBE: ${{ needs.check-upstream.outputs.upstream_tag }}
        run: python -m build --wheel --no-isolation --outdir dist

      - name: Verify wheel tag
        env:
          UPSTREAM_TAG: ${{ needs.check-upstream.outputs.upstream_tag }}
        run: |
          import glob, os
          version = os.environ["UPSTREAM_TAG"].removeprefix("v")
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected 1 wheel, got {wheels}"
          name = os.path.basename(wheels[0])
          print(f"Wheel: {name}")
          assert "cp315-cp315t" in name, f"Expected cp315-cp315t in {name}"
          assert name.startswith(f"duckdb-{version}-"), f"Expected version {version} in {name}"
        shell: python

      - name: Install + smoke test
        run: |
          import glob, subprocess, sys
          wheels = glob.glob("dist/*.whl")
          subprocess.check_call([sys.executable, "-m", "pip", "install",
                                 "--no-deps", "--force-reinstall", wheels[0]])
          subprocess.check_call([sys.executable, "-m", "pytest",
                                 "_our/tests/fast/test_cp315t_smoke.py", "-v"])
        shell: python

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl

  publish:
    needs: [check-upstream, build]
    if: needs.check-upstream.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      # GITHUB_TOKEN defaults to read-only; gh release create/delete need write.
      contents: write
    steps:
      - name: Checkout repo (needed for tag creation)
        # gh release create runs git to create the tag; without a checkout
        # the publish job has no .git and fails with "not a git repository".
        # Must run BEFORE the artifact download: the first checkout performs
        # `git clean -ffdx`, which would wipe the just-downloaded dist/.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/

      - name: Create rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream_tag="${{ needs.check-upstream.outputs.upstream_tag }}"
          upstream_commit="${{ needs.check-upstream.outputs.upstream_commit }}"
          wheels=$(find dist -name "*.whl" | sort | tr '\n' ' ')
          echo "Wheels: $wheels"

          # Delete old release + tag (rolling)
          gh release delete cp315t --cleanup-tag --yes 2>/dev/null || true

          # Write notes to a file (avoids heredoc breaking YAML block scalar)
          {
            echo "Auto-published cp315t (free-threaded) wheels."
            echo ""
            echo "- upstream-tag: ${upstream_tag}"
            echo "- upstream-commit: ${upstream_commit}"
            echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- platforms: windows-2022, ubuntu-24.04"
            echo "- python: 3.15t (free-threaded, GIL disabled)"
            echo ""
            echo "Install: pip install <wheel-file>"
            echo ""
            echo "This release is rolling: each successful build replaces the previous one."
          } > release_notes.md

          gh release create cp315t \
            --title "duckdb cp315t - upstream ${upstream_tag}" \
            --notes-file release_notes.md \
            $wheels
